name: Deploy Pages

# Ad-hoc deployment workflow for the static site.
# Triggers:
#   - Any push to main (auto-deploy after deploy.sh push)
#   - Manual: Actions tab → "Deploy Pages" → Run workflow
#   - CLI:    gh workflow run pages.yml

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you redeploying? (logged only)"
        required: false
        default: "Manual ad-hoc deploy"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Allow only one concurrent deploy; cancel queued duplicates.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Privacy guard (block Huxity-side files)
        run: |
          set -e
          BAD=$(find . \
            \( -path ./.git -prune \) -o \
            \( -path ./_site -prune \) -o \
            \( -iname 'portfolio*.html' -o \
               -iname 'play_targets*.json' -o \
               -iname '.env*' -o \
               -iname '*_private.*' -o \
               -iname '*.pem' -o \
               -iname '*.key' -o \
               -iname '*.p12' -o \
               -path './.netlify/*' -o \
               -path './perplexing-trades-reimagined/*' -o \
               -path './archives/*' \
            \) -print)
          if [ -n "$BAD" ]; then
            echo "::error::Forbidden files committed to public repo:"
            echo "$BAD"
            exit 1
          fi
          echo "Privacy guard: clean."

      - name: Build public artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html archive.html methodology.html styles.css app.js _site/
          cp -R assets _site/assets
          find _site -type f \( \
            -name '.DS_Store' -o \
            -name 'Thumbs.db' -o \
            -iname '.env*' -o \
            -iname 'portfolio*.html' -o \
            -iname 'play_targets*.json' -o \
            -iname '*_private.*' -o \
            -iname '*.pem' -o \
            -iname '*.key' -o \
            -iname '*.p12' \
          \) -print -quit | grep -q . && {
            echo "::error::Forbidden file staged for Pages"
            exit 1
          }
          find _site -maxdepth 2 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
